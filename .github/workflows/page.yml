name: Pages

env:
  TZ: Asia/Shanghai

on:
  pull_request:
  push:
    branches:
      - main  # 默认分支
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Check and build blog
    uses: ./.github/workflows/blog-lint.yml

  deploy:
    name: Deploy checked site
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download checked site
        uses: actions/download-artifact@v4
        with:
          name: checked-blog-site
          path: public/

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true  # 确保干净的部署历史
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: ${{ github.event.head_commit.message || github.sha }}
