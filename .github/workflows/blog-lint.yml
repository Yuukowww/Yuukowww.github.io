name: Blog rendering lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test lint rules against the blog renderer
        run: |
          npm run test:blog-lint
          npm test
      - name: Check Markdown and Hexo tags
        run: npm run lint:blog:source
      - name: Build actual site
        run: npm run build
      - name: Check generated navigation and article history
        run: |
          npm run test:toc
          npm run test:profile
      - name: Check generated article HTML
        run: npm run lint:blog:html
      - name: Upload checked site for deployment
        uses: actions/upload-artifact@v4
        with:
          name: checked-blog-site
          path: public/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
